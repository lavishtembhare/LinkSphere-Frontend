<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Top Ribbon Gradient -->
    <linearGradient id="topRibbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Bottom Ribbon Gradient -->
    <linearGradient id="bottomRibbonGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.9" />
    </linearGradient>

    <!-- Core Link Glow Filter -->
    <filter id="bloomFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="128" cy="128" r="110" fill="url(#portalGlow)" />

  <!-- Outer Telemetry Halo -->
  <circle 
    cx="128" 
    cy="128" 
    r="104" 
    stroke="url(#ringGrad)" 
    stroke-width="3" 
    stroke-dasharray="16 8 4 8 32 8" 
    stroke-linecap="round"
  />

  <!-- Secondary Inner Precision Track -->
  <circle 
    cx="128" 
    cy="128" 
    r="90" 
    stroke="#38BDF8" 
    stroke-width="1.5" 
    stroke-opacity="0.25" 
    stroke-dasharray="4 12"
  />

  <!-- Central Continuous "S / Infinity" Ribbon -->
  <g filter="url(#bloomFilter)">
    <!-- Upper Loop & Intersection Arc -->
    <path 
      d="M128 44 C82 44 46 80 46 126 C46 156 68 182 98 188 C124 193 148 178 162 154 L178 126 C190 106 206 98 210 98" 
      stroke="url(#topRibbonGrad)" 
      stroke-width="14" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Lower Loop & Return Arc -->
    <path 
      d="M128 212 C174 212 210 176 210 130 C210 100 188 74 158 68 C132 63 108 78 94 102 L78 130 C66 150 50 158 46 158" 
      stroke="url(#bottomRibbonGrad)" 
      stroke-width="14" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>

  <!-- Focal Center Data Pulse Point -->
  <circle cx="128" cy="128" r="8" fill="#FFFFFF" />
  <circle cx="128" cy="128" r="14" fill="#38BDF8" opacity="0.4" />

  <!-- Orbital Data Beacons -->
  <circle cx="48" cy="88" r="4.5" fill="#38BDF8" />
  <circle cx="208" cy="168" r="4.5" fill="#60A5FA" />
  <circle cx="128" cy="24" r="3" fill="#FFFFFF" />
  <circle cx="128" cy="232" r="3" fill="#FFFFFF" />
</svg>
